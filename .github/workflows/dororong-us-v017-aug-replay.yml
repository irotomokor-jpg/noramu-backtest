name: Dororong US v0.17 Aug 03-10 Replay Audit
on:
  workflow_dispatch:
  push:
    branches: [agent/dororong-us-v017-aug-replay-audit]
    paths:
      - 'dororong_us_v017_aug03_10_replay_audit.py'
      - '.github/workflows/dororong-us-v017-aug-replay.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dororong-us-v017-aug-replay-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U pandas numpy yfinance requests lxml html5lib beautifulsoup4
      - name: Compile
        run: python -m py_compile dororong_us_v017_aug03_10_replay_audit.py
      - name: Run replay audit
        run: python dororong_us_v017_aug03_10_replay_audit.py --outdir dororong_us_v017_replay_output
      - name: Verify outputs
        run: |
          test -s dororong_us_v017_replay_output/scorecard.json
          test -f dororong_us_v017_replay_output/replay_event_log.csv
          test -f dororong_us_v017_replay_output/minute_execution_audit.csv
          cat dororong_us_v017_replay_output/scorecard.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dororong-us-v017-aug-replay
          path: dororong_us_v017_replay_output/
      - name: Persist result to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dororong_us_v017_replay_output
          git diff --cached --quiet || git commit -m 'dororong: persist v0.17 replay audit result [skip ci]'
          git push origin HEAD:agent/dororong-us-v017-aug-replay-audit

name: US Leveraged ETF v0.02 Robustness

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/us-leveraged-etf-v002-robustness"
    paths:
      - "us_leveraged_etf_v001_ma200.py"
      - "us_leveraged_etf_v002_robustness.py"
      - "requirements.txt"
      - ".github/workflows/us-leveraged-etf-v002.yml"

permissions:
  contents: write

concurrency:
  group: us-leveraged-etf-v002-robustness
  cancel-in-progress: false

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and self-test
        run: |
          python -m py_compile us_leveraged_etf_v001_ma200.py us_leveraged_etf_v002_robustness.py
          python us_leveraged_etf_v002_robustness.py --self-test

      - name: Run robustness matrix
        run: |
          rm -rf us_leveraged_etf_v002_output
          python us_leveraged_etf_v002_robustness.py \
            --cache-dir us_leveraged_etf_v002_cache \
            --outdir us_leveraged_etf_v002_output

      - name: Verify and print result
        run: |
          test -f us_leveraged_etf_v002_output/RUN_VALIDATION.txt
          grep -q '^PASS' us_leveraged_etf_v002_output/RUN_VALIDATION.txt
          grep -q 'NO_ORDERS' us_leveraged_etf_v002_output/RUN_VALIDATION.txt
          cat us_leveraged_etf_v002_output/scorecard.json
          cat us_leveraged_etf_v002_output/robustness_decisions.csv
          cat us_leveraged_etf_v002_output/defensive_sleeves.csv

      - name: Upload research artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: us-leveraged-etf-v002-${{ github.run_number }}
          path: us_leveraged_etf_v002_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist research result to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us_leveraged_etf_v002_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "us-etf: persist v0.02 robustness results [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

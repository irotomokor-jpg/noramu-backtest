name: Dororong US v0.19 Timed Exit + July Funnel
on:
  workflow_dispatch:
  push:
    branches: [agent/dororong-us-v019-timed-exit-policy-audit]
    paths:
      - 'dororong_us_v019_timed_exit_and_july_funnel.py'
      - '.github/workflows/dororong-us-v019-timed-exit-and-july-funnel.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dororong-us-v019-timed-exit-policy-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U pandas numpy yfinance
      - name: Compile
        run: python -m py_compile dororong_us_v019_timed_exit_and_july_funnel.py
      - name: Run audit
        run: python dororong_us_v019_timed_exit_and_july_funnel.py
      - name: Verify
        run: |
          test -s dororong_us_v019_audit_output/scorecard.json
          test -s dororong_us_v019_audit_output/timed_exit_policy_audit.csv
          test -s dororong_us_v019_audit_output/july_signal_funnel.csv
          cat dororong_us_v019_audit_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: dororong-v019-exit-policy-july-funnel
          path: dororong_us_v019_audit_output/
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dororong_us_v019_audit_output
          git diff --cached --quiet || git commit -m 'dororong: persist v0.19 audit result [skip ci]'
          git pull --rebase origin agent/dororong-us-v019-timed-exit-policy-audit
          git push origin HEAD:agent/dororong-us-v019-timed-exit-policy-audit

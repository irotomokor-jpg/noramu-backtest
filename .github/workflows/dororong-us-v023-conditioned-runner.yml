name: Dororong US v0.23 Conditioned Runner Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dororong-us-v023-conditioned-runner
    paths:
      - dororong_us_v023_conditioned_runner_audit.py
      - .github/workflows/dororong-us-v023-conditioned-runner.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy yfinance requests
      - run: python -m py_compile dororong_us_v023_conditioned_runner_audit.py
      - run: python dororong_us_v023_conditioned_runner_audit.py
      - run: cat dororong_us_v023_conditioned_runner_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: dororong-us-v023-conditioned-runner
          path: dororong_us_v023_conditioned_runner_output/
      - name: Persist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dororong_us_v023_conditioned_runner_output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: persist Doro v0.23 conditioned runner"
          git push

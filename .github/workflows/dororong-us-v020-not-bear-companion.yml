name: Dororong US v0.20 NOT_BEAR Companion Replay
on:
  workflow_dispatch:
  push:
    branches: [agent/dororong-us-v020-not-bear-companion]
    paths:
      - 'dororong_us_v020_not_bear_companion_replay.py'
      - '.github/workflows/dororong-us-v020-not-bear-companion.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dororong-us-v020-not-bear-companion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -U pandas numpy yfinance pyarrow requests lxml html5lib beautifulsoup4
      - name: Compile
        run: python -m py_compile dororong_us_v020_not_bear_companion_replay.py
      - name: Run comparison replay
        run: python dororong_us_v020_not_bear_companion_replay.py --outdir dororong_us_v020_output
      - name: Verify outputs
        run: |
          test -s dororong_us_v020_output/scorecard.json
          test -f dororong_us_v020_output/variant_cost_summary.csv
          test -f dororong_us_v020_output/period_summary.csv
          test -f dororong_us_v020_output/gate_comparison.csv
          test -f dororong_us_v020_output/lower_tf_first_touch_NOT_BEAR.csv
          cat dororong_us_v020_output/scorecard.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dororong-v020-not-bear-companion
          path: dororong_us_v020_output/
      - name: Persist result to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dororong_us_v020_output
          git diff --cached --quiet || git commit -m 'dororong: persist v0.20 companion replay [skip ci]'
          git pull --rebase origin agent/dororong-us-v020-not-bear-companion
          git push origin HEAD:agent/dororong-us-v020-not-bear-companion

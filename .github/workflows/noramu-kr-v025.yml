name: Noramu v0.25-KR Cross-Market Replication

on:
  workflow_dispatch:
  push:
    branches:
      - research/kr-level-rr-v025
    paths:
      - "kr_level_rr_v025.py"
      - "requirements-kr.txt"
      - "noramu_level_rr_v025_kr_spec.md"
      - ".github/workflows/noramu-kr-v025.yml"

permissions:
  contents: write

concurrency:
  group: noramu-v025-kr
  cancel-in-progress: false

jobs:
  kr-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/kr-level-rr-v025

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Frozen KR adapter self-test
        run: python kr_level_rr_v025.py --self-test

      - name: Run KOSPI/KOSDAQ exact-rule replication
        run: |
          rm -rf kr_latest_output
          mkdir -p kr_latest_output kr_state
          python kr_level_rr_v025.py \
            --outdir kr_latest_output \
            --state-dir kr_state \
            --period-60m 730d \
            --top-n 40

      - name: Verify KR run
        run: |
          test -f kr_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_latest_output/RUN_VALIDATION.txt
          cat kr_latest_output/RUN_VALIDATION.txt
          echo "--- summary ---"
          cat kr_latest_output/kr_strategy_summary.csv

      - name: Upload KR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-v025-kr-${{ github.run_number }}
          path: |
            kr_latest_output/
            kr_state/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist frozen universe and latest KR result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kr_state kr_latest_output
          if git diff --cached --quiet; then
            echo "No KR state/output changes to commit."
            exit 0
          fi

          git commit -m "kr: persist v0.25 frozen universe/results [skip ci]"

          for attempt in 1 2 3 4; do
            git fetch origin research/kr-level-rr-v025
            if git rebase origin/research/kr-level-rr-v025; then
              if git push origin HEAD:research/kr-level-rr-v025; then
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "KR persistence retry ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "Unable to persist KR state after retries."
          exit 1

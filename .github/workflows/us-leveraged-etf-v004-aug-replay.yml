name: US Leveraged ETF v0.04 Aug 03-10 Replay Audit
on:
  workflow_dispatch:
  push:
    branches: [agent/us-leveraged-etf-v004-aug-replay-audit]
    paths:
      - 'us_leveraged_etf_v004_aug03_10_replay_audit.py'
      - '.github/workflows/us-leveraged-etf-v004-aug-replay.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-leveraged-etf-v004-aug-replay-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy yfinance requests
      - run: python -m py_compile us_leveraged_etf_v004_aug03_10_replay_audit.py
      - run: python us_leveraged_etf_v004_aug03_10_replay_audit.py
      - run: |
          test -s us_leveraged_etf_v004_replay_output/scorecard.json
          cat us_leveraged_etf_v004_replay_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: us-leveraged-etf-v004-aug-replay
          path: us_leveraged_etf_v004_replay_output/
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f us_leveraged_etf_v004_replay_output
          git diff --cached --quiet || git commit -m 'us-etf: persist v0.04 replay audit result [skip ci]'
          git push origin HEAD:agent/us-leveraged-etf-v004-aug-replay-audit

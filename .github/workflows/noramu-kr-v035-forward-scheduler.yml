name: Noramu KR v0.35 Forward Daily Scheduler

on:
  workflow_dispatch:
  schedule:
    # Weekdays 16:40 KST = 07:40 UTC. Runs after KRX regular-session close.
    - cron: "40 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v035-forward-daily
  cancel-in-progress: false

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: agent/noramu-kr-v035-forward-shadow
    steps:
      - name: Checkout frozen v0.35 research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Validate frozen configuration
        run: |
          python -m py_compile kr_level_rr_v035_forward_shadow.py
          python kr_level_rr_v035_forward_shadow.py --self-test

      - name: Run shadow-only forward observation
        run: |
          mkdir -p kr_v035_forward_output
          python kr_level_rr_v035_forward_shadow.py \
            --outdir kr_v035_forward_output \
            --period-60m 730d

      - name: Verify no-order forward run
        run: |
          test -f kr_v035_forward_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v035_forward_output/RUN_VALIDATION.txt
          grep -q 'SHADOW_ONLY_NO_ORDERS' kr_v035_forward_output/RUN_VALIDATION.txt
          cat kr_v035_forward_output/RUN_VALIDATION.txt
          cat kr_v035_forward_output/forward_daily_history.csv

      - name: Upload observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v035-forward-daily-${{ github.run_number }}
          path: kr_v035_forward_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist observation to frozen research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v035_forward_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist scheduled v0.35 forward observation [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

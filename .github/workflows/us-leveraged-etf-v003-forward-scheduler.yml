name: US Leveraged ETF v0.03 Forward Daily Scheduler

on:
  workflow_dispatch:
  schedule:
    # 22:20 UTC = 07:20 KST next day. Runs after US close in both DST/standard time.
    - cron: "20 22 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/us-leveraged-etf-v003-forward-scheduler.yml"

permissions:
  contents: write

concurrency:
  group: us-leveraged-etf-v003-forward-shadow
  cancel-in-progress: false

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen v0.03 research branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-leveraged-etf-v003-forward-shadow
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate frozen forward configuration
        run: |
          python -m py_compile us_leveraged_etf_v001_ma200.py us_leveraged_etf_v003_forward_shadow.py
          python us_leveraged_etf_v003_forward_shadow.py --self-test
          grep -q 'FORWARD_SIGNAL_START = pd.Timestamp("2026-08-11")' us_leveraged_etf_v003_forward_shadow.py
          grep -q 'SHADOW_ONLY_NO_ORDERS' us_leveraged_etf_v003_forward_shadow.py

      - name: Run shadow-only forward observation
        run: |
          rm -rf us_leveraged_etf_v003_forward_output
          python us_leveraged_etf_v003_forward_shadow.py \
            --cache-dir us_leveraged_etf_v003_cache \
            --outdir us_leveraged_etf_v003_forward_output

      - name: Verify no-order forward run
        run: |
          test -f us_leveraged_etf_v003_forward_output/RUN_VALIDATION.txt
          grep -q '^PASS' us_leveraged_etf_v003_forward_output/RUN_VALIDATION.txt
          grep -q 'NO_ORDERS' us_leveraged_etf_v003_forward_output/RUN_VALIDATION.txt
          cat us_leveraged_etf_v003_forward_output/forward_state.json
          cat us_leveraged_etf_v003_forward_output/forward_summary.csv

      - name: Upload observation artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: us-leveraged-etf-v003-forward-${{ github.run_number }}
          path: us_leveraged_etf_v003_forward_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist observation to frozen research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us_leveraged_etf_v003_forward_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "us-etf: persist scheduled v0.03 forward observation [skip ci]"
          BRANCH="agent/us-leveraged-etf-v003-forward-shadow"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

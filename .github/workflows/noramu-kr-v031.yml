name: Noramu KR v0.31 Pullback Regime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-kr-v031-pullback-regime"
    paths:
      - "kr_level_rr_v025.py"
      - "kr_level_rr_v026_pit.py"
      - "kr_level_rr_v027_execution.py"
      - "kr_level_rr_v028_execution_filter.py"
      - "kr_level_rr_v029_adaptive_exit_entry.py"
      - "kr_level_rr_v030_regime_robustness.py"
      - "kr_level_rr_v031_pullback_regime.py"
      - "finalize_kr_v031.py"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-kr-v031.yml"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v031-pullback-regime
  cancel-in-progress: false

jobs:
  kr-v031:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test v0.31
        run: |
          python -m py_compile kr_level_rr_v031_pullback_regime.py finalize_kr_v031.py
          python kr_level_rr_v031_pullback_regime.py --self-test

      - name: Run KOSPI PIT v0.31 matrix
        run: |
          rm -rf kr_v031_latest_output
          mkdir -p kr_v031_latest_output kr_state_pit
          python kr_level_rr_v031_pullback_regime.py \
            --outdir kr_v031_latest_output \
            --state-dir kr_state_pit \
            --period-60m 730d

      - name: Finalize and verify ranking
        run: |
          python finalize_kr_v031.py
          test -f kr_v031_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v031_latest_output/RUN_VALIDATION.txt
          echo "--- scorecard ---"
          cat kr_v031_latest_output/kr_v031_scorecard.json
          echo "--- gate counts ---"
          cat kr_v031_latest_output/actual_entry_gate_counts.csv
          echo "--- finalists ---"
          cat kr_v031_latest_output/kr_v031_finalists.csv
          echo "--- same-run v0.29 ---"
          cat kr_v031_latest_output/v029_same_run_control.csv
          cat kr_v031_latest_output/v029_same_run_periods.csv

      - name: Upload v0.31 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v031-pullback-regime-${{ github.run_number }}
          path: |
            kr_v031_latest_output/
            kr_state_pit/kr_universe_v026_pit.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest v0.31 result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v031_latest_output kr_state_pit/kr_universe_v026_pit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist v0.31 pullback regime result [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

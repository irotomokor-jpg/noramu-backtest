name: KR v0.38 July Signal Funnel
on:
  workflow_dispatch:
  push:
    branches: [agent/kr-v038-july-signal-funnel-audit]
    paths:
      - 'kr_v038_july_signal_funnel_audit.py'
      - '.github/workflows/kr-v038-july-signal-funnel.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kr-v038-july-signal-funnel-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy
      - name: Compile
        run: python -m py_compile kr_v038_july_signal_funnel_audit.py
      - name: Run audit
        run: python kr_v038_july_signal_funnel_audit.py
      - name: Verify
        run: |
          test -s kr_v038_july_funnel_output/scorecard.json
          test -s kr_v038_july_funnel_output/july_signal_funnel.csv
          test -s kr_v038_july_funnel_output/monthly_final_candidate_counts_2026.csv
          cat kr_v038_july_funnel_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: kr-v038-july-signal-funnel
          path: kr_v038_july_funnel_output/
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f kr_v038_july_funnel_output
          git diff --cached --quiet || git commit -m 'kr: persist v0.38 July funnel [skip ci]'
          git pull --rebase origin agent/kr-v038-july-signal-funnel-audit
          git push origin HEAD:agent/kr-v038-july-signal-funnel-audit

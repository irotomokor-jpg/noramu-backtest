name: KOSDAQ Theme Replay v0.01
on:
  workflow_dispatch:
  push:
    branches: [agent/kosdaq-themes-v001-replay]
    paths:
      - 'kosdaq_theme_replay_v001.py'
      - '.github/workflows/kosdaq-themes-v001-replay.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kosdaq-themes-v001-replay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy yfinance requests
      - run: python -m py_compile kosdaq_theme_replay_v001.py
      - run: python kosdaq_theme_replay_v001.py
      - run: cat kosdaq_theme_replay_v001_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: kosdaq-theme-replay-v001
          path: kosdaq_theme_replay_v001_output/
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kosdaq_theme_replay_v001_output
          if ! git diff --cached --quiet; then
            git commit -m 'results: persist KOSDAQ theme replay v0.01'
            git push
          fi

name: KODEX Non-Battery Non-Bio v0.02 Expanded

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kodex-nonbattery-nonbio-v002-expanded-themes
    paths:
      - kodex_nonbattery_nonbio_v002_expanded.py
      - .github/workflows/kodex-nonbattery-nonbio-v002.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy yfinance requests
      - run: python -m py_compile kodex_nonbattery_nonbio_v001.py kodex_nonbattery_nonbio_v002_expanded.py noramu_etf_v033_entries.py
      - run: python kodex_nonbattery_nonbio_v002_expanded.py
      - run: cat kodex_nonbattery_nonbio_v002_output/strict_scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: kodex-nonbattery-nonbio-v002-expanded
          path: kodex_nonbattery_nonbio_v002_output/
      - name: Persist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kodex_nonbattery_nonbio_v002_output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: persist KODEX v0.02 expanded screen"
          git push

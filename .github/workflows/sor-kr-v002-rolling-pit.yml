name: SOR KR v0.02 Rolling PIT

# Trigger after workflow registration on the research branch.
on:
  workflow_dispatch:
  push:
    branches: [research/sor-exit-v001]
    paths:
      - "sor_kr_v002_rolling_pit.py"
      - "sor_entry_v004_breakout.py"
      - "sor_v010_shared_portfolio.py"
      - "requirements-kr.txt"
      - ".github/workflows/sor-kr-v002-rolling-pit.yml"

permissions:
  contents: write

concurrency:
  group: sor-kr-v002-rolling-pit
  cancel-in-progress: false

jobs:
  rolling-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sor-exit-v001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test
        run: |
          python -m py_compile sor_kr_v002_rolling_pit.py
          python sor_kr_v002_rolling_pit.py --self-test

      - name: Run rolling PIT robustness
        run: |
          rm -rf sor_kr_v002_rolling_pit_output
          python sor_kr_v002_rolling_pit.py \
            --outdir sor_kr_v002_rolling_pit_output \
            --top-n 40 \
            --download-start 2017-01-01 \
            --end-exclusive 2026-08-18

      - name: Verify
        run: |
          test -f sor_kr_v002_rolling_pit_output/RUN_VALIDATION.txt
          grep -q '^PASS' sor_kr_v002_rolling_pit_output/RUN_VALIDATION.txt
          cat sor_kr_v002_rolling_pit_output/verdict.csv
          cat sor_kr_v002_rolling_pit_output/overall_score.csv

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sor-kr-v002-rolling-pit-${{ github.run_number }}
          path: sor_kr_v002_rolling_pit_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sor_kr_v002_rolling_pit_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sor: persist KR v0.02 rolling PIT [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin research/sor-exit-v001
            if ! git rebase origin/research/sor-exit-v001; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:research/sor-exit-v001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

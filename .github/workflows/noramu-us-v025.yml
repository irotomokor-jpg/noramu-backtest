name: Noramu US v0.25 C-S3 MRS2 Robustness Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-us-v025-cs3-mrs2-robustness"
    paths:
      - "noramu_us_v07_legacy_engine.py"
      - "noramu_us_v025_cs3_mrs2_robustness.py"
      - "requirements.txt"
      - ".github/workflows/noramu-us-v025.yml"

permissions:
  contents: write

concurrency:
  group: noramu-us-v025-cs3-mrs2
  cancel-in-progress: false

jobs:
  us-v025:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and self-test
        run: |
          python -m py_compile noramu_us_v025_cs3_mrs2_robustness.py
          python noramu_us_v025_cs3_mrs2_robustness.py --self-test

      - name: Run frozen US robustness matrix
        run: |
          rm -rf us_v025_latest_output
          mkdir -p us_v025_latest_output
          python noramu_us_v025_cs3_mrs2_robustness.py \
            --outdir us_v025_latest_output \
            --period-60m 730d

      - name: Verify result
        run: |
          test -f us_v025_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' us_v025_latest_output/RUN_VALIDATION.txt
          cat us_v025_latest_output/RUN_VALIDATION.txt
          echo "--- scorecard ---"
          cat us_v025_latest_output/us_v025_scorecard.json
          echo "--- summary ---"
          cat us_v025_latest_output/us_v025_summary.csv
          echo "--- top contributor exclusion ---"
          cat us_v025_latest_output/us_v025_top_contributor_exclusion.csv

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-us-v025-cs3-mrs2-${{ github.run_number }}
          path: us_v025_latest_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us_v025_latest_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "us: persist v0.25 C-S3 MRS2 robustness result [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

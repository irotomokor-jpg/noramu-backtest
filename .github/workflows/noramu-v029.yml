name: Noramu v0.29 Staged Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "noramu_v029_research.py"
      - "V029_PROTOCOL.md"
      - "requirements.txt"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-v029.yml"
  push:
    branches: [main]
    paths:
      - "noramu_v029_research.py"
      - "V029_PROTOCOL.md"
      - "requirements.txt"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-v029.yml"

permissions:
  contents: write

concurrency:
  group: noramu-v029-staged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kr-v029:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-kr.txt
      - name: Install KR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt
      - name: Compile and self-test
        run: |
          python -m py_compile noramu_v029_research.py
          python noramu_v029_research.py --self-test
      - name: Run v0.28 diagnosis and KR v0.29A/B
        run: |
          mkdir -p v029_kr_output kr_state_pit v029_cache
          python noramu_v029_research.py \
            --mode all \
            --markets KOSPI,KOSDAQ \
            --outdir v029_kr_output \
            --state-dir kr_state_pit \
            --cache-dir v029_cache \
            --period-60m 730d
      - name: Verify KR result
        run: |
          grep -q '^PASS' v029_kr_output/RUN_VALIDATION.txt
          grep -q '^PASS' v029_kr_output/v028_diagnosis/RUN_VALIDATION.txt
          cat v029_kr_output/v029_scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noramu-v029-kr-${{ github.run_number }}
          path: v029_kr_output/
          if-no-files-found: warn
          retention-days: 90

  us-v029:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install US dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and self-test
        run: |
          python -m py_compile noramu_v029_research.py
          python noramu_v029_research.py --self-test
      - name: Run US v0.29A/B separately
        run: |
          mkdir -p v029_us_output v029_cache
          python noramu_v029_research.py \
            --mode backtest \
            --markets US \
            --outdir v029_us_output \
            --cache-dir v029_cache \
            --us-period-60m 730d \
            --us-top-n 80 \
            --min-us-coverage 65
      - name: Verify US result
        run: |
          grep -q '^PASS' v029_us_output/RUN_VALIDATION.txt
          cat v029_us_output/v029_scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noramu-v029-us-${{ github.run_number }}
          path: v029_us_output/
          if-no-files-found: warn
          retention-days: 90

  persist-results:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kr-v029, us-v029]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: noramu-v029-kr-*
          path: v029_latest_output/kr
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: noramu-v029-us-*
          path: v029_latest_output/us
          merge-multiple: true
      - name: Verify combined persisted result
        run: |
          grep -q '^PASS' v029_latest_output/kr/RUN_VALIDATION.txt
          grep -q '^PASS' v029_latest_output/us/RUN_VALIDATION.txt
      - name: Persist v0.29 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v029_latest_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist v0.29 result [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

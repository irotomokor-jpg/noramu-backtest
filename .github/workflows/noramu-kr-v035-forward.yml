name: Noramu KR v0.35 Frozen Forward Shadow Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-kr-v035-forward-shadow"
    paths:
      - "kr_level_rr_v025.py"
      - "kr_level_rr_v026_pit.py"
      - "kr_level_rr_v027_execution.py"
      - "kr_level_rr_v028_execution_filter.py"
      - "kr_level_rr_v029_adaptive_exit_entry.py"
      - "kr_level_rr_v030_regime_robustness.py"
      - "kr_level_rr_v031_pullback_regime.py"
      - "kr_level_rr_v032_portfolio_walkforward.py"
      - "kr_level_rr_v033_dynamic_pit_universe.py"
      - "kr_level_rr_v0331_dynamic_pit_hotfix.py"
      - "kr_level_rr_v034_dynamic_regime_final.py"
      - "kr_level_rr_v035_forward_shadow.py"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-kr-v035-forward.yml"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v035-forward-shadow
  cancel-in-progress: false

jobs:
  forward-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test frozen forward validator
        run: |
          python -m py_compile kr_level_rr_v035_forward_shadow.py
          python kr_level_rr_v035_forward_shadow.py --self-test

      - name: Run shadow-only forward validation
        run: |
          mkdir -p kr_v035_forward_output
          python kr_level_rr_v035_forward_shadow.py \
            --outdir kr_v035_forward_output \
            --period-60m 730d

      - name: Verify forward run
        run: |
          test -f kr_v035_forward_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v035_forward_output/RUN_VALIDATION.txt
          grep -q 'SHADOW_ONLY_NO_ORDERS' kr_v035_forward_output/RUN_VALIDATION.txt
          cat kr_v035_forward_output/RUN_VALIDATION.txt
          echo "--- forward history ---"
          cat kr_v035_forward_output/forward_daily_history.csv

      - name: Upload forward artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v035-forward-shadow-${{ github.run_number }}
          path: kr_v035_forward_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist forward observation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v035_forward_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist v0.35 frozen forward observation [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

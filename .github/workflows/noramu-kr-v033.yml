name: Noramu KR v0.33.1 Dynamic PIT Universe Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-kr-v033-dynamic-pit-universe"
    paths:
      - "kr_level_rr_v025.py"
      - "kr_level_rr_v026_pit.py"
      - "kr_level_rr_v027_execution.py"
      - "kr_level_rr_v028_execution_filter.py"
      - "kr_level_rr_v029_adaptive_exit_entry.py"
      - "kr_level_rr_v030_regime_robustness.py"
      - "kr_level_rr_v031_pullback_regime.py"
      - "kr_level_rr_v032_portfolio_walkforward.py"
      - "kr_level_rr_v033_dynamic_pit_universe.py"
      - "kr_level_rr_v0331_dynamic_pit_hotfix.py"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-kr-v033.yml"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v033-dynamic-pit-universe
  cancel-in-progress: false

jobs:
  kr-v033:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test v0.33.1
        run: |
          python -m py_compile kr_level_rr_v033_dynamic_pit_universe.py kr_level_rr_v0331_dynamic_pit_hotfix.py
          python kr_level_rr_v0331_dynamic_pit_hotfix.py --self-test

      - name: Run corrected dynamic PIT validation
        run: |
          rm -rf kr_v033_latest_output
          mkdir -p kr_v033_latest_output
          python kr_level_rr_v0331_dynamic_pit_hotfix.py \
            --outdir kr_v033_latest_output \
            --period-60m 730d

      - name: Verify v0.33.1 run
        run: |
          test -f kr_v033_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v033_latest_output/RUN_VALIDATION.txt
          grep -q 'v0.33.1-KR-DYNAMIC-PIT-UNIVERSE-HOTFIX' kr_v033_latest_output/RUN_VALIDATION.txt
          cat kr_v033_latest_output/RUN_VALIDATION.txt
          echo "--- snapshots ---"
          cat kr_v033_latest_output/snapshot_coverage.csv
          echo "--- static vs dynamic ---"
          cat kr_v033_latest_output/static_vs_dynamic.csv
          echo "--- dynamic cost stress ---"
          cat kr_v033_latest_output/dynamic_cost_stress.csv
          echo "--- turnover ---"
          cat kr_v033_latest_output/snapshot_turnover.csv

      - name: Upload v0.33.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v0331-dynamic-pit-${{ github.run_number }}
          path: kr_v033_latest_output/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest v0.33.1 result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v033_latest_output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist corrected v0.33.1 dynamic PIT result [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: US RSI Trend Companion v0.01
on:
  workflow_dispatch:
  push:
    branches: [agent/us-rsi-companion-v001]
    paths:
      - 'us_rsi_trend_companion_v001.py'
      - '.github/workflows/us-rsi-companion-v001.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-rsi-companion-v001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U pandas numpy yfinance pyarrow requests
      - name: Compile
        run: python -m py_compile us_rsi_trend_companion_v001.py
      - name: Run research
        run: python us_rsi_trend_companion_v001.py --outdir us_rsi_companion_v001_output
      - name: Verify
        run: |
          test -s us_rsi_companion_v001_output/scorecard.json
          test -f us_rsi_companion_v001_output/summary.csv
          test -f us_rsi_companion_v001_output/period_summary.csv
          cat us_rsi_companion_v001_output/scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: us-rsi-companion-v001
          path: us_rsi_companion_v001_output/
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f us_rsi_companion_v001_output
          git diff --cached --quiet || git commit -m 'research: persist RSI companion v0.01 [skip ci]'
          git pull --rebase origin agent/us-rsi-companion-v001
          git push origin HEAD:agent/us-rsi-companion-v001

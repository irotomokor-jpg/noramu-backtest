name: Noramu KR v0.32 Portfolio Robustness Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-kr-v032-portfolio-walkforward"
    paths:
      - "kr_level_rr_v025.py"
      - "kr_level_rr_v026_pit.py"
      - "kr_level_rr_v027_execution.py"
      - "kr_level_rr_v028_execution_filter.py"
      - "kr_level_rr_v029_adaptive_exit_entry.py"
      - "kr_level_rr_v030_regime_robustness.py"
      - "kr_level_rr_v031_pullback_regime.py"
      - "kr_level_rr_v032_portfolio_walkforward.py"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-kr-v032.yml"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v032-portfolio-walkforward
  cancel-in-progress: false

jobs:
  kr-v032:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test v0.32
        run: |
          python -m py_compile kr_level_rr_v032_portfolio_walkforward.py
          python kr_level_rr_v032_portfolio_walkforward.py --self-test

      - name: Run KOSPI PIT v0.32 robustness suite
        run: |
          rm -rf kr_v032_latest_output
          mkdir -p kr_v032_latest_output kr_state_pit
          python kr_level_rr_v032_portfolio_walkforward.py \
            --outdir kr_v032_latest_output \
            --state-dir kr_state_pit \
            --period-60m 730d

      - name: Verify v0.32 run
        run: |
          test -f kr_v032_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v032_latest_output/RUN_VALIDATION.txt
          cat kr_v032_latest_output/RUN_VALIDATION.txt
          echo "--- order sensitivity ---"
          cat kr_v032_latest_output/order_sensitivity.csv
          echo "--- universe sensitivity ---"
          cat kr_v032_latest_output/universe_topn_sensitivity.csv
          echo "--- contributor exclusion ---"
          cat kr_v032_latest_output/contributor_exclusion_resim.csv
          echo "--- cost stress ---"
          cat kr_v032_latest_output/cost_stress.csv

      - name: Upload v0.32 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v032-portfolio-robustness-${{ github.run_number }}
          path: |
            kr_v032_latest_output/
            kr_state_pit/kr_universe_v026_pit.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest v0.32 result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v032_latest_output kr_state_pit/kr_universe_v026_pit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist v0.32 portfolio robustness result [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

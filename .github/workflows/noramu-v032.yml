name: Noramu Dororong v0.32 US Runner Exit Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "noramu_dororong_v032_runner_exits.py"
      - "V032_PROTOCOL.md"
      - "noramu_dororong_v031_diagnostics.py"
      - "noramu_dororong_v030_separated.py"
      - "requirements.txt"
      - ".github/workflows/noramu-v032.yml"
  push:
    branches: [main]
    paths:
      - "noramu_dororong_v032_runner_exits.py"
      - "V032_PROTOCOL.md"
      - "noramu_dororong_v031_diagnostics.py"
      - "noramu_dororong_v030_separated.py"
      - "requirements.txt"
      - ".github/workflows/noramu-v032.yml"

permissions:
  contents: read

concurrency:
  group: us-pre2-runner-v032-${{ github.ref }}
  cancel-in-progress: false

jobs:
  us-v032:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install US dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and self-test
        run: |
          python -m py_compile noramu_dororong_v032_runner_exits.py
          python noramu_dororong_v032_runner_exits.py --self-test
      - name: Run frozen US PRE2 runner-exit diagnostic
        run: |
          mkdir -p v032_us_output v032_cache
          python noramu_dororong_v032_runner_exits.py \
            --markets US \
            --outdir v032_us_output \
            --cache-dir v032_cache \
            --us-period-60m 730d \
            --period-daily 5y \
            --us-top-n 120 \
            --dynamic-top-n-us 50 \
            --min-us-coverage 90
      - name: Verify v0.32 diagnostic contract
        run: |
          grep -q '^PASS' v032_us_output/RUN_VALIDATION.txt
          grep -q '^us_only=1' v032_us_output/RUN_VALIDATION.txt
          grep -q '^fixed_signal_context=1' v032_us_output/RUN_VALIDATION.txt
          grep -q '^pullback_quantile=0.75' v032_us_output/RUN_VALIDATION.txt
          grep -q '^normal_pullbacks_only_for_calibration=1' v032_us_output/RUN_VALIDATION.txt
          grep -q '^terminal_pullbacks_used_for_calibration=0' v032_us_output/RUN_VALIDATION.txt
          grep -q '^walkforward_asof=1' v032_us_output/RUN_VALIDATION.txt
          grep -q '^selection_uses_2026=0' v032_us_output/RUN_VALIDATION.txt
          grep -q '^live_approval=0' v032_us_output/RUN_VALIDATION.txt
          cat v032_us_output/v032_scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-pre2-runner-v032-${{ github.run_number }}
          path: v032_us_output/
          if-no-files-found: warn
          retention-days: 90

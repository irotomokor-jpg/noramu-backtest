name: Noramu KR v0.30 Regime Robustness Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/noramu-kr-v030-regime-robustness"
    paths:
      - "kr_level_rr_v025.py"
      - "kr_level_rr_v026_pit.py"
      - "kr_level_rr_v027_execution.py"
      - "kr_level_rr_v028_execution_filter.py"
      - "kr_level_rr_v029_adaptive_exit_entry.py"
      - "kr_level_rr_v030_regime_robustness.py"
      - "run_kr_v030.py"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-kr-v030.yml"

permissions:
  contents: write

concurrency:
  group: noramu-kr-v030-regime-robustness
  cancel-in-progress: false

jobs:
  kr-v030:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-kr.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt

      - name: Compile and self-test v0.30
        run: |
          python -m py_compile kr_level_rr_v030_regime_robustness.py run_kr_v030.py
          python kr_level_rr_v030_regime_robustness.py --self-test

      - name: Run KOSPI PIT v0.30 robustness matrix
        run: |
          rm -rf kr_v030_latest_output
          mkdir -p kr_v030_latest_output kr_state_pit
          python run_kr_v030.py \
            --outdir kr_v030_latest_output \
            --state-dir kr_state_pit \
            --period-60m 730d

      - name: Verify v0.30 run
        run: |
          test -f kr_v030_latest_output/RUN_VALIDATION.txt
          grep -q '^PASS' kr_v030_latest_output/RUN_VALIDATION.txt
          cat kr_v030_latest_output/RUN_VALIDATION.txt
          echo "--- finalists ---"
          cat kr_v030_latest_output/kr_v030_finalists.csv
          echo "--- 2026 OOS ---"
          cat kr_v030_latest_output/kr_v030_oos_2026.csv
          echo "--- July 2026 ---"
          cat kr_v030_latest_output/kr_v030_july_2026.csv
          echo "--- same-run v0.29 control ---"
          cat kr_v030_latest_output/v029_same_run_control.csv

      - name: Upload v0.30 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noramu-kr-v030-regime-robustness-${{ github.run_number }}
          path: |
            kr_v030_latest_output/
            kr_state_pit/kr_universe_v026_pit.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest v0.30 result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_v030_latest_output kr_state_pit/kr_universe_v026_pit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "kr: persist v0.30 regime robustness result [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; exit 1; fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

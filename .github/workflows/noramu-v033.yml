name: Noramu v0.33 KR US ETF Entry Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "noramu_etf_v033_entries.py"
      - "V033_PROTOCOL.md"
      - "requirements.txt"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-v033.yml"
  push:
    branches: [main]
    paths:
      - "noramu_etf_v033_entries.py"
      - "V033_PROTOCOL.md"
      - "requirements.txt"
      - "requirements-kr.txt"
      - ".github/workflows/noramu-v033.yml"

permissions:
  contents: read

concurrency:
  group: etf-entry-v033-${{ github.ref }}
  cancel-in-progress: false

jobs:
  us-v033:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install US dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and self-test
        run: |
          python -m py_compile noramu_etf_v033_entries.py
          python noramu_etf_v033_entries.py --self-test
      - name: Run frozen US ETF entry research
        run: |
          mkdir -p v033_us_output v033_us_cache
          python noramu_etf_v033_entries.py \
            --markets US \
            --outdir v033_us_output \
            --cache-dir v033_us_cache \
            --period-daily 5y \
            --period-60m 730d \
            --min-us-coverage 18
      - name: Verify US v0.33 contract
        run: |
          grep -q '^PASS' v033_us_output/RUN_VALIDATION.txt
          grep -q '^etf_long_only=1' v033_us_output/RUN_VALIDATION.txt
          grep -q '^common_exit_across_modes=1' v033_us_output/RUN_VALIDATION.txt
          grep -q '^signal_close_entry_next_open=1' v033_us_output/RUN_VALIDATION.txt
          grep -q '^selection_uses_2026=0' v033_us_output/RUN_VALIDATION.txt
          grep -q '^live_approval=0' v033_us_output/RUN_VALIDATION.txt
          cat v033_us_output/v033_scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-entry-v033-us-${{ github.run_number }}
          path: v033_us_output/
          if-no-files-found: warn
          retention-days: 90

  kr-v033:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-kr.txt
      - name: Install KR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kr.txt
      - name: Compile and self-test
        run: |
          python -m py_compile noramu_etf_v033_entries.py
          python noramu_etf_v033_entries.py --self-test
      - name: Run frozen KR ETF entry research
        run: |
          mkdir -p v033_kr_output v033_kr_cache
          python noramu_etf_v033_entries.py \
            --markets KR \
            --outdir v033_kr_output \
            --cache-dir v033_kr_cache \
            --period-daily 5y \
            --period-60m 730d \
            --min-kr-coverage 12
      - name: Verify KR v0.33 contract
        run: |
          grep -q '^PASS' v033_kr_output/RUN_VALIDATION.txt
          grep -q '^etf_long_only=1' v033_kr_output/RUN_VALIDATION.txt
          grep -q '^common_exit_across_modes=1' v033_kr_output/RUN_VALIDATION.txt
          grep -q '^signal_close_entry_next_open=1' v033_kr_output/RUN_VALIDATION.txt
          grep -q '^selection_uses_2026=0' v033_kr_output/RUN_VALIDATION.txt
          grep -q '^live_approval=0' v033_kr_output/RUN_VALIDATION.txt
          cat v033_kr_output/v033_scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-entry-v033-kr-${{ github.run_number }}
          path: v033_kr_output/
          if-no-files-found: warn
          retention-days: 90
